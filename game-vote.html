<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 게임 투표 & 룰렛</title>
<link href="https://fonts.googleapis.com/css2?family=Gmarket+Sans:wght@300;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 기존 스타일 및 추가 스타일 */
:root {
  --bg: #0c0c10; --surface: #16161e; --surface2: #1e1e28; --border: rgba(255,255,255,0.07);
  --accent: #818cf8; --accent2: #fb923c; --accent3: #34d399; --danger: #f87171; --text: #e8e8f0; --muted: rgba(232,232,240,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; overflow-x: hidden; }
.wrap { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; padding: 2rem 1.25rem 5rem; }
.screen { display: none; animation: fadeIn 0.3s ease; }
.screen.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* 강조 전광판 */
.winner-announcement { background: linear-gradient(135deg, rgba(129,140,248,0.2), rgba(251,146,60,0.1)); border: 2px solid var(--accent); border-radius: 20px; padding: 2rem; text-align: center; margin-bottom: 2rem; position: relative; overflow: hidden; }
.winner-announcement h2 { font-family: 'Gmarket Sans'; font-size: 1.8rem; margin-bottom: 0.5rem; color: #fff; }
.winner-announcement p { font-size: 1.1rem; color: var(--accent3); font-weight: 700; }
.crown-icon { font-size: 3rem; display: block; margin-bottom: 0.5rem; }

/* 룰렛 스타일 */
.roulette-container { position: relative; width: 300px; height: 300px; margin: 2rem auto; }
canvas { width: 100%; height: 100%; border-radius: 50%; border: 5px solid var(--surface2); }
.roulette-arrow { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid var(--danger); z-index: 10; }

/* 단계 내비게이션 버튼 */
.step-nav { display: flex; gap: 10px; margin-top: 1.5rem; }
.btn { padding: 12px 20px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; transition: all 0.2s; font-family: 'Noto Sans KR'; }
.btn-primary { background: var(--accent); color: #fff; width: 100%; }
.btn-ghost { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

/* 기존 카드 스타일 유지 */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 1.5rem; margin-bottom: 12px; }
.input-row { display: flex; gap: 8px; margin-bottom: 1rem; }
input[type=text] { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: #fff; }
.star { flex: 1; height: 40px; border-radius: 10px; background: var(--surface2); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.star.sel { background: var(--accent); color: #fff; }
.star.s1.sel { background: var(--danger); }
.badge-warn { background: rgba(248,113,113,0.15); color: var(--danger); padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; }

/* 단계 인디케이터 */
.step-indicator { display: flex; justify-content: center; gap: 8px; margin-bottom: 2rem; }
.step-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--surface2); }
.step-dot.active { background: var(--accent); width: 25px; border-radius: 5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="screen active" id="screen-nick">
    <div style="text-align:center;">
      <h1 style="font-family:'Gmarket Sans'; margin-bottom:2rem;">🎮 Game Selector</h1>
      <input type="text" id="nick-input" placeholder="닉네임 입력..." style="text-align:center; width:80%; margin-bottom:1rem;">
      <button class="btn btn-primary" onclick="confirmNick()">입장하기</button>
    </div>
  </div>

  <div class="screen" id="screen-home">
    <div class="card" onclick="createRoom()">🏠 새 투표방 만들기</div>
    <div class="card" onclick="document.getElementById('join-input').style.display='block'">🚪 방 참가하기</div>
    <div id="join-input" style="display:none;" class="input-row">
      <input type="text" id="room-code-input" placeholder="코드 6자리">
      <button class="btn btn-primary" style="width:auto;" onclick="joinRoom()">참가</button>
    </div>
  </div>

  <div class="screen" id="screen-room">
    <div class="step-indicator">
      <div class="step-dot active" id="dot-1"></div>
      <div class="step-dot" id="dot-2"></div>
      <div class="step-dot" id="dot-3"></div>
    </div>

    <div id="step-1" class="room-step">
      <div class="card">
        <h3>🎯 후보 게임 추가</h3>
        <p style="font-size:0.8rem; color:var(--muted); margin-bottom:1rem;">오늘 하고 싶은 게임을 모두 적어주세요.</p>
        <div class="input-row">
          <input type="text" id="game-input" placeholder="게임 이름...">
          <button class="btn btn-primary" style="width:auto;" onclick="addGame()">추가</button>
        </div>
        <div id="game-list"></div>
      </div>
      <button class="btn btn-primary" onclick="goToStep(2)">다음: 투표하기 →</button>
    </div>

    <div id="step-2" class="room-step" style="display:none;">
      <div class="card">
        <h3>⭐ 점수 매기기</h3>
        <div id="vote-list"></div>
      </div>
      <button class="btn btn-primary" id="btn-submit-vote" onclick="submitVote()">투표 제출하기 ✓</button>
      <div id="wait-msg" style="display:none; text-align:center; margin-top:1rem; color:var(--accent3);">모든 인원이 투표할 때까지 기다려주세요...</div>
    </div>

    <div id="step-3" class="room-step" style="display:none;">
      <div id="result-winner-area"></div>
      <div class="card">
        <h3>📊 세부 결과</h3>
        <div id="result-detail-list"></div>
      </div>
      
      <div class="card" id="roulette-section">
        <h3>🎡 결과가 맘에 안 드시나요?</h3>
        <p style="font-size:0.8rem; color:var(--muted);">투표 점수 비율대로 칸이 커지는 룰렛입니다.</p>
        <div class="routte-container">
          <div class="roulette-arrow"></div>
          <canvas id="rouletteCanvas" width="300" height="300"></canvas>
        </div>
        <button class="btn btn-primary" onclick="spinRoulette()">룰렛 돌리기!!</button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// Firebase 설정 (기존 설정 유지)
firebase.initializeApp({
  apiKey: "AIzaSyBt_av2DXu9hP0kYGJFW9bsCAJ4qfKai9E",
  databaseURL: "https://gameselecter-14467-default-rtdb.firebaseio.com",
  projectId: "gameselecter-14467"
});
const db = firebase.database();

let myNick = localStorage.getItem('gv_nick') || '';
let roomCode = '';
let roomData = {};
let currentStep = 1;
let myTempVote = {};

// 1~3단계 화면 전환 로직
function goToStep(step) {
  currentStep = step;
  document.querySelectorAll('.room-step').forEach((el, idx) => el.style.display = (idx + 1 === step) ? 'block' : 'none');
  document.querySelectorAll('.step-dot').forEach((el, idx) => el.classList.toggle('active', idx + 1 === step));
  if(step === 2) renderVoteList();
  if(step === 3) renderResults();
}

function renderVoteList() {
  const el = document.getElementById('vote-list');
  const games = roomData.games || [];
  el.innerHTML = games.map(g => `
    <div class="card" style="margin-bottom:8px;">
      <div style="margin-bottom:8px;">${g}</div>
      <div class="stars" style="display:flex; gap:5px;">
        ${[1,2,3,4,5].map(n => `<div class="star ${myTempVote[g]===n?'sel':''} ${n===1?'s1':''}" onclick="setTempScore('${g}',${n})">${n}</div>`).join('')}
      </div>
    </div>
  `).join('');
}

function setTempScore(game, score) {
  myTempVote[game] = score;
  renderVoteList();
}

async function submitVote() {
  if(Object.keys(myTempVote).length < roomData.games.length) { alert("모든 게임에 투표해주세요!"); return; }
  await db.ref(`rooms/${roomCode}/votes/${myNick}`).set(myTempVote);
  document.getElementById('btn-submit-vote').style.display = 'none';
  document.getElementById('wait-msg').style.display = 'block';
}

// 결과 렌더링 및 룰렛 초기화
function renderResults() {
  const votes = roomData.votes || {};
  const members = Object.keys(roomData.members || {});
  const games = roomData.games || [];
  
  // 점수 계산 루틴
  const scores = games.map(g => {
    let total = 0, ones = 0;
    members.forEach(m => {
      const s = votes[m]?.[g] || 0;
      total += s;
      if(s === 1) ones++;
    });
    return { name: g, total, ones };
  }).sort((a,b) => b.total - a.total);

  const winner = scores[0];
  document.getElementById('result-winner-area').innerHTML = `
    <div class="winner-announcement">
      <span class="crown-icon">👑</span>
      <h2>${winner.name}</h2>
      <p>투표로 선정되었습니다! (${winner.total}점)</p>
    </div>
  `;

  document.getElementById('result-detail-list').innerHTML = scores.map(s => `
    <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border);">
      <span>${s.name} ${s.ones > 0 ? `<span class="badge-warn">👎 1점 ${s.ones}명</span>` : ''}</span>
      <span style="font-weight:700;">${s.total}점</span>
    </div>
  `).join('');

  initRoulette(scores);
}

// 룰렛 로직
let rouletteItems = [];
function initRoulette(scores) {
  rouletteItems = scores;
  const canvas = document.getElementById('rouletteCanvas');
  const ctx = canvas.getContext('2d');
  const totalScore = scores.reduce((a,b) => a + b.total, 0);
  
  let startAngle = 0;
  scores.forEach((s, i) => {
    const sliceAngle = (s.total / totalScore) * 2 * Math.PI;
    ctx.beginPath();
    ctx.fillStyle = `hsl(${i * 40}, 70%, 60%)`;
    ctx.moveTo(150, 150);
    ctx.arc(150, 150, 140, startAngle, startAngle + sliceAngle);
    ctx.fill();
    
    // 텍스트 추가
    ctx.save();
    ctx.translate(150, 150);
    ctx.rotate(startAngle + sliceAngle / 2);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 14px Noto Sans KR";
    ctx.fillText(s.name.substring(0, 5), 70, 0);
    ctx.restore();
    
    startAngle += sliceAngle;
  });
}

function spinRoulette() {
  const canvas = document.getElementById('rouletteCanvas');
  let rand = Math.random() * 3600 + 1080;
  canvas.style.transition = "transform 4s cubic-bezier(0.15, 0, 0.15, 1)";
  canvas.style.transform = `rotate(${rand}deg)`;
}

// 초기화/참가 함수 (기존 로직과 동일하므로 생략 가능하나 핵심만 유지)
async function confirmNick() {
  myNick = document.getElementById('nick-input').value.trim();
  if(!myNick) return;
  localStorage.setItem('gv_nick', myNick);
  document.getElementById('screen-nick').classList.remove('active');
  document.getElementById('screen-home').classList.add('active');
}

async function createRoom() {
  roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
  await db.ref('rooms/' + roomCode).set({
    games: [], members: {[myNick]: true}, votes: {}
  });
  enterRoom();
}

function enterRoom() {
  document.getElementById('screen-home').classList.remove('active');
  document.getElementById('screen-room').classList.add('active');
  db.ref('rooms/' + roomCode).on('value', snap => {
    roomData = snap.val();
    const votedCount = Object.keys(roomData.votes || {}).length;
    const memberCount = Object.keys(roomData.members || {}).length;
    if(votedCount === memberCount && memberCount > 0 && currentStep === 2) goToStep(3);
  });
}

async function addGame() {
  const name = document.getElementById('game-input').value;
  const games = roomData.games || [];
  games.push(name);
  await db.ref(`rooms/${roomCode}/games`).set(games);
  document.getElementById('game-list').innerHTML = games.map(g => `<div>• ${g}</div>`).join('');
}
</script>
</body>
</html>
