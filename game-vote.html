function initRoulette() {
    const section = document.getElementById('roulette-section');

        section.style.display = 'none';

    }
}

    switchRoomTab('vote');
}

function renderResultTab() {
    const el = document.getElementById('result-list');
    const allVoted = checkAllVoted();
    
    if (!allVoted) {
        // ... 미완료 메시지 ...
        document.getElementById('roulette-section').style.display = 'none';
        return;
    }

    // 결과 리스트 렌더링 후 룰렛 초기화 호출
    renderResultList(el); 
    setTimeout(initRoulette, 50); // DOM 렌더링 후 안정적으로 호출
