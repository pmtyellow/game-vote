<div class="screen" id="screen-home">
  <div class="logo"><h1>🎮 게임 투표</h1><p>친구들과 오늘 뭐 할지 정해요</p></div>
  <div id="home-my-nick"></div>
  <div class="home-actions">
    </div>
  <div style="text-align:center; margin-top:2rem; font-size:0.7rem; color:var(--muted);">v1.7</div>
</div>

<div id="rtab-content-result" style="display:none">
    <div id="result-display-area"></div>
    <div id="roulette-section" style="margin-top:20px; display:none;">
        <div class="card" style="text-align:center;">
            <p class="sec-label">🎡 점수 비례 룰렛</p>
            <canvas id="roulette-canvas" width="300" height="300" style="max-width:100%;"></canvas>
            <div id="roulette-btn-container" style="margin-top:15px;"></div>
        </div>
    </div>
</div>

<script>
// ... 기존 초기화 코드 ...
const VERSION = "1.7";

// 1. 룰렛이 안 보이는 문제 해결을 위한 탭 전환 로직 수정
function switchRoomTab(tab) {
  ['games','vote','result'].forEach(t => {
    document.getElementById('rtab-'+t).classList.toggle('active', t===tab);
    document.getElementById('rtab-content-'+t).style.display = t===tab?'block':'none';
  });
  
  if (tab==='vote') renderVoteTab();
  if (tab==='result') {
    renderResultTab();
    // 탭 클릭 시 즉시 룰렛 관련 데이터 확인 및 렌더링
    setTimeout(() => { checkAndRenderRoulette(); }, 50); 
  }
}

// 2. 룰렛을 돌린 후 다시 할 수 있도록 하는 초기화 함수
async function resetRouletteForRetry() {
  if(!confirm("다시 돌리기 위해 현재 룰렛 결과를 초기화할까요? (전원 동의 필요 시스템 적용 시 동의 데이터가 초기화됩니다)")) return;
  
  await db.ref(`rooms/${roomCode}/rouletteResult`).remove();
  await db.ref(`rooms/${roomCode}/rouletteAgreements`).remove();
  
  alert("룰렛이 초기화되었습니다. 다시 동의를 진행해주세요.");
  renderResultTab();
}

// 3. 결과 화면 렌더링 시 룰렛 관련 버튼 로직 (반복 가능하도록)
function renderResultTab() {
  const el = document.getElementById('result-list');
  // ... (기존 결과 계산 로직) ...

  // 룰렛 결과가 이미 있다면 '다시 하기' 버튼을 보여줌
  if (roomData.rouletteResult) {
      const retryBtn = `<button class="btn btn-accent2 btn-full" onclick="resetRouletteForRetry()" style="margin-top:10px;">🎡 결과가 아쉽다면? 다시 돌리기 (동의 초기화)</button>`;
      // 결과 하단에 추가
      el.insertAdjacentHTML('beforeend', retryBtn);
  }
}

// 4. 룰렛 캔버스 렌더링 및 가시성 확보
function checkAndRenderRoulette() {
    const rouletteArea = document.getElementById('roulette-section');
    if (checkAllVoted()) {
        rouletteArea.style.display = 'block';
        drawRoulette(); // 캔버스 그리기 함수 호출
    } else {
        rouletteArea.style.display = 'none';
    }
}

// 페이지 로드 시 버전 콘솔 출력 (디버깅용)
console.log(`Game Vote Version: ${VERSION}`);
</script>
